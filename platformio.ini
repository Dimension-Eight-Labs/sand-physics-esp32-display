; Waveshare ESP32-S3-LCD-1.47B falling-sand demo.
;
; One environment per APP_MODE:
;   pio run -e testpattern -t upload    colour bars, offset/orientation check
;   pio run -e tiltdot     -t upload    rolling dot + raw accel log, IMU mapping check
;   pio run -e sand        -t upload    the demo (default)
;
; There is no dedicated PlatformIO board for this module, so we start from
; esp32-s3-devkitc-1 and override flash size; PSRAM is enabled in
; sdkconfig.defaults (ESP32-S3R8 = 8 MB octal PSRAM in-package). Each
; environment generates its own sdkconfig.<env> from sdkconfig.defaults.

[platformio]
default_envs = sand

[env]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = espidf
board_upload.flash_size = 16MB

; USB-C goes straight to the S3's USB-Serial-JTAG (IO19/IO20), which
; enumerates as a CDC-ACM device. Change the port if yours differs.
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; Baud rate is ignored by USB-Serial-JTAG but must be set to something.
monitor_speed = 115200
; Don't toggle DTR/RTS when the monitor opens: on USB-Serial-JTAG those lines
; drive the chip's reset/boot logic.
monitor_dtr = 0
monitor_rts = 0
monitor_filters = direct, esp32_exception_decoder

[env:sand]
build_flags = -DAPP_MODE=MODE_SAND

[env:tiltdot]
build_flags = -DAPP_MODE=MODE_TILT_DOT

[env:testpattern]
build_flags = -DAPP_MODE=MODE_TEST_PATTERN
